<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HEIC decoder check</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 16px; background: #fff; color: #222; }
      #drop { border: 2px dashed #999; border-radius: 8px; padding: 24px; margin: 12px 0; text-align: center; color: #666; }
      #log { white-space: pre-wrap; font: 12px ui-monospace, monospace; background: #f4f4f4; padding: 8px; border-radius: 4px; }
      canvas { max-width: 480px; border: 1px solid #ccc; }
    </style>
  </head>
  <body>
    <!-- Standalone page for checking the HEIC decoder (src/decode) in a
         browser. Not part of the production build (only index.html is). -->
    <h1>HEIC decoder check</h1>
    <p>
      <input type="file" id="file" accept=".heic,.heif,image/heic,image/heif" />
    </p>
    <div id="drop">or drop a file here</div>
    <pre id="log">pick or drop a HEIC/HEIF file</pre>
    <canvas id="preview"></canvas>
    <script type="module" src="/src/decode/dev/heicDevPage.ts"></script>
  </body>
</html>
